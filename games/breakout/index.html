<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>打砖块</title>
<style>

*{box-sizing:border-box}

body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;
  background-image:radial-gradient(700px 400px at 20% -10%,rgba(255,122,217,.18),transparent 60%),radial-gradient(600px 300px at 90% 0%,rgba(96,165,250,.14),transparent 60%)}
.top{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 6px;flex-wrap:wrap}

</head>
<body>
<div class="top">
  <div class="ttl">🧱 打砖块<small>接住球，清空砖块，捡道具</small></div>
  <div class="stat"><span>分数</span><b id="score">0</b></div>

</div>
<div class="stage">
  <canvas id="cv"></canvas>

</div>
<div class="tip">鼠标 / 触屏拖动挡板 · ← → 移动 · 空格 / 点击发球 · Esc 暂停 · 道具：W 加宽 · M 分裂 · S 减速 · ♥ 加命</div>
<script>
'use strict';
/* @lb-start */
/* 英雄榜客户端（由 tools/inject.mjs 注入到每个自制游戏，源文件 games/_shared/leaderboard.js，改这里再 node tools/inject.mjs） */
const LB = (() => {
  const API = '/api/scores', CAP = 20, NAME_KEY = 'gh:name';
  const enabled = /^https?:$/.test(location.protocol);
  const getName = () => { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } };
  const setName = n => { try { localStorage.setItem(NAME_KEY, n); } catch (e) {} };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const CSS = `.lb-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,10,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.lb-panel{width:min(92vw,420px);max-height:86vh;overflow:auto;background:#161b2c;color:#e8ecf5;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 18px 14px;box-shadow:0 24px 70px -20px rgba(0,0,0,.8);position:relative}
.lb-panel h3{margin:0 0 4px;font-size:18px;font-weight:900;padding-right:36px}.lb-panel h3 small{color:#8b93a7;font-weight:500;font-size:12px;margin-left:8px}
.lb-x{position:absolute;right:10px;top:10px;width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#e8ecf5;font-size:16px;cursor:pointer}
.lb-tabs{display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap}.lb-tabs button{font:inherit;font-size:12.5px;font-weight:700;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#aab3c8;border-radius:999px;padding:5px 11px;cursor:pointer}.lb-tabs button.on{background:#ffd166;color:#1a1200;border-color:#ffd166}
.lb-list{list-style:none;margin:0;padding:0}.lb-list li{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px}.lb-list li:nth-child(1) .lb-rk{background:#ffd166;color:#1a1200}.lb-list li:nth-child(2) .lb-rk{background:#cfd6e4;color:#1a1200}.lb-list li:nth-child(3) .lb-rk{background:#d9a066;color:#1a1200}
.lb-rk{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:12.5px;flex:none}.lb-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.lb-sc{font-weight:800;white-space:nowrap}.lb-dt{color:#5f677a;font-size:11.5px;white-space:nowrap}
.lb-empty,.lb-note{color:#8b93a7;font-size:13px;text-align:center;padding:14px 0}.lb-list li.me{background:rgba(255,209,102,.12);border-radius:8px}
.lb-offer{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.35);text-align:left;font-size:13.5px;line-height:1.5;color:inherit}
.lb-offer b{color:#d98f00}.lb-offer .row{display:flex;gap:8px;margin-top:8px}.lb-offer input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid rgba(128,128,128,.4);background:rgba(255,255,255,.9);color:#111}
.lb-offer button{font:inherit;font-weight:800;font-size:13.5px;border:0;border-radius:8px;padding:8px 12px;background:#ffb703;color:#1a1200;cursor:pointer;white-space:nowrap}.lb-offer button[disabled]{opacity:.6;cursor:default}.lb-offer a{color:#d98f00;font-weight:700;cursor:pointer;text-decoration:underline}
.lb-offer .ok{color:#2a9d4a;font-weight:800}`;
  function ensureCss() { if (!document.getElementById('lb-css')) { const s = document.createElement('style'); s.id = 'lb-css'; s.textContent = CSS; document.head.appendChild(s); } }
  const fmtDate = at => { const d = new Date(at); return `${d.getMonth() + 1}/${d.getDate()}`; };
  async function fetchList(game, board, limit = CAP) { const r = await fetch(`${API}?game=${encodeURIComponent(game)}&board=${encodeURIComponent(board)}&limit=${limit}`, { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
  async function submit(game, board, name, score, meta) { const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ game, board, name, score, meta }) }); const j = await r.json().catch(() => ({})); if (!r.ok || !j.ok) throw new Error(j.error || ('http ' + r.status)); return j; }
  const qualifies = (list, dir, score) => list.length < CAP || (dir === 'desc' ? score > list[list.length - 1].score : score < list[list.length - 1].score);
  function renderList(ul, list, fmt, meId) {
    ul.innerHTML = list.length ? list.map(e => `<li${meId && e.id === meId ? ' class="me"' : ''}><span class="lb-rk">${e.rank}</span><span class="lb-nm">${esc(e.name)}</span><span class="lb-sc">${esc(fmt(e.score, e))}</span><span class="lb-dt">${fmtDate(e.at)}</span></li>`).join('') : '<li class="lb-empty">还没有人上榜，来当第一个！</li>';
  }
  // 弹出榜单：boards = [{key,label}]，fmt(score, entry) → 显示文本
  async function show(game, boards, fmt, title = '🏆 英雄榜') {
    if (!enabled) return alert('英雄榜需要在线打开（game.satloot.com）');
    ensureCss(); if (typeof boards === 'string') boards = [{ key: boards, label: '' }];
    const ov = document.createElement('div'); ov.className = 'lb-ov';
    ov.innerHTML = `<div class="lb-panel"><button class="lb-x" title="关闭">✕</button><h3>${esc(title)}<small>前 ${CAP} 名</small></h3>${boards.length > 1 ? `<div class="lb-tabs">${boards.map((b, i) => `<button data-k="${esc(b.key)}"${i ? '' : ' class="on"'}>${esc(b.label)}</button>`).join('')}</div>` : ''}<ul class="lb-list"><li class="lb-empty">加载中…</li></ul></div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove(); ov.querySelector('.lb-x').onclick = close; ov.addEventListener('pointerdown', e => { if (e.target === ov) close(); });
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); window.removeEventListener('keydown', onKey, true); } }; window.addEventListener('keydown', onKey, true);
    const ul = ov.querySelector('.lb-list');
    const loadBoard = async k => { ul.innerHTML = '<li class="lb-empty">加载中…</li>'; try { const j = await fetchList(game, k); renderList(ul, j.list, fmt); } catch (e) { ul.innerHTML = '<li class="lb-empty">榜单暂时打不开</li>'; } };
    ov.querySelectorAll('.lb-tabs button').forEach(b => b.onclick = () => { ov.querySelectorAll('.lb-tabs button').forEach(x => x.classList.toggle('on', x === b)); loadBoard(b.dataset.k); });
    loadBoard(boards[0].key);
  }
  // 在结算面板里给出「留名上榜」：host 为容器元素
  function offer(host, { game, board, score, meta, fmt, boards, title }) {
    if (!host) return; host.innerHTML = '';
    if (!enabled || !(score > 0)) return;
    ensureCss(); const box = document.createElement('div'); box.className = 'lb-offer'; box.innerHTML = '🏆 英雄榜 · 查询中…'; host.appendChild(box);
    const showLink = () => `<a class="lb-view">查看榜单</a>`;
    const bind = () => { const a = box.querySelector('.lb-view'); if (a) a.onclick = () => show(game, boards || board, fmt, title); };
    fetchList(game, board).then(j => {
      if (!qualifies(j.list, j.dir, score)) { box.innerHTML = `本局 <b>${esc(fmt(score, { meta }))}</b> 未进前 ${CAP} 名 · ${showLink()}`; bind(); return; }
      const rankGuess = j.list.filter(e => j.dir === 'desc' ? e.score >= score : e.score <= score).length + 1;
      box.innerHTML = `🎉 <b>${esc(fmt(score, { meta }))}</b> 能排到第 <b>${rankGuess}</b> 名！留个名字上榜：<div class="row"><input maxlength="12" placeholder="你的名字（最多 12 字）" value="${esc(getName())}"><button>留名上榜</button></div>`;
      const inp = box.querySelector('input'), btn = box.querySelector('button');
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); e.stopPropagation(); }); inp.addEventListener('keyup', e => e.stopPropagation());
      btn.onclick = async () => {
        const name = inp.value.trim(); if (!name) { inp.focus(); return; } setName(name); btn.disabled = true; btn.textContent = '提交中…';
        try { const r = await submit(game, board, name, score, meta); box.innerHTML = `<span class="ok">✔ 上榜成功，第 ${r.rank} 名！</span> ${showLink()}`; bind(); }
        catch (e) { btn.disabled = false; btn.textContent = '重试'; const m = /too many/.test(e.message) ? '提交太频繁，稍后再试' : /range/.test(e.message) ? '成绩不在合理范围' : '提交失败'; let t = box.querySelector('.lb-err'); if (!t) { t = document.createElement('div'); t.className = 'lb-err'; box.appendChild(t); } t.textContent = m; }
      };
      setTimeout(() => { try { inp.focus(); } catch (e) {} }, 50);
    }).catch(() => { box.innerHTML = '🏆 英雄榜暂时打不开'; });
  }
  return { enabled, show, offer, getName, fetchList, submit, CAP };
})();
/* @lb-end */
const Q = new URLSearchParams(location.search);
const STILL = parseInt(Q.get('still') || '0', 10) || 0, SEED = parseInt(Q.get('seed') || '0', 10) || 0;
let _s = (SEED || (Date.now() & 0x7fffffff)) >>> 0;
const rnd = () => { _s = (_s + 0x6d2b79f5) >>> 0; let t = _s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const KEY = 'gh:breakout:';
const store = { get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} } };
const SFX = (() => { let ac = null, muted = store.get('mute', false);
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  const tone = (f, d = 0.08, type = 'sine', v = 0.16, f2) => { if (muted) return; const a = ctx(); if (!a) return; const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, a.currentTime); if (f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + d); g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d + 0.02); };
  return { tone, get muted() { return muted; }, toggle() { muted = !muted; store.set('mute', muted); return muted; }, unlock() { ctx(); } };
})();
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const W = 480, H = 600; let scale = 1;
const COLS = 10, GAP = 4, PADX = 14, TOP = 60, BW = (W - PADX * 2 - GAP * (COLS - 1)) / COLS, BH = 20;
const ROWC = ['#ff5d8f', '#ff9f43', '#ffd93d', '#6bde7d', '#4fc3f7', '#b388ff', '#ff7ad9', '#7dd3fc'];
let bricks = [], balls = [], drops = [], parts = [], paddle = { x: W / 2, w: 90, wideT: 0 }, slowT = 0;
let score = 0, best = store.get('best', 0), level = 1, lives = 3, state = 'title', last = 0, shake = 0, combo = 0;
const speedBase = () => Math.min(520, 300 + (level - 1) * 22);

function buildLevel(L) {
  bricks = []; const rows = Math.min(8, 4 + L); const pat = (L - 1) % 4;
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
    let ok = true;
    if (pat === 1) ok = (r + c) % 2 === 0 || r < 2;
    else if (pat === 2) ok = Math.abs(c - 4.5) <= r + 0.5;
    else if (pat === 3) ok = !(r % 3 === 1 && c % 3 === 1);
    if (!ok) continue;
    const hp = L >= 2 && ((r + L) % 3 === 0) ? 2 : 1;
    bricks.push({ x: PADX + c * (BW + GAP), y: TOP + r * (BH + GAP), hp, max: hp, col: ROWC[r % ROWC.length] });
  }
}
function newBall(x, y, vx, vy) { return { x, y, vx, vy, r: 7, stuck: false }; }
function serveBall() { balls = [newBall(paddle.x, H - 52 - 8, 0, 0)]; balls[0].stuck = true; }
function launch() { for (const b of balls) if (b.stuck) { b.stuck = false; const a = (rnd() * 0.8 - 0.4); const s = speedBase(); b.vx = Math.sin(a) * s; b.vy = -Math.cos(a) * s; SFX.tone(500, 0.06, 'square', 0.08, 700); } }
function startGame() { score = 0; level = 1; lives = 3; combo = 0; paddle.w = 90; paddle.wideT = 0; slowT = 0; drops = []; parts = []; buildLevel(1); serveBall(); state = 'play'; hideOv(); hud(); last = performance.now(); }
function nextLevel() { level++; buildLevel(level); drops = []; paddle.wideT = 0; paddle.w = 90; slowT = 0; serveBall(); state = 'play'; hideOv(); hud(); last = performance.now(); }
function loseLife() { lives--; combo = 0; shake = 1; SFX.tone(200, 0.4, 'sawtooth', 0.14, 50); hud(); if (lives <= 0) { state = 'over'; if (score > best) { best = score; store.set('best', best); } hud(); showOv('游戏结束', `第 ${level} 关 · ${score} 分 · 最高 ${best} 分`, [['再来一局', startGame]]); LB.offer($('#ovLB'), { game: 'breakout', board: 'score', score, meta: { level }, fmt: lbFmt }); } else { drops = []; paddle.w = 90; paddle.wideT = 0; slowT = 0; serveBall(); } }
function hud() { $('#score').textContent = score; $('#best').textContent = Math.max(best, score); $('#lv').textContent = level; $('#lives').textContent = '❤'.repeat(Math.max(0, lives)) || '—'; $('#btnPause').textContent = state === 'pause' ? '▶' : '⏸'; }
function showOv(t, p, btns) { $('#ovT').textContent = t; $('#ovP').innerHTML = p; const b = $('#ovB'); b.innerHTML = ''; $('#ovLB').innerHTML = ''; for (const [label, fn, ghost] of btns) { const el = document.createElement('button'); el.textContent = label; if (ghost) el.className = 'ghost'; el.onclick = fn; b.appendChild(el); } $('#ov').hidden = false; }
function hideOv() { $('#ov').hidden = true; }
function pause() { if (state !== 'play') return; state = 'pause'; hud(); showOv('已暂停', '按 Esc / P 或点击继续', [['继续', resume]]); }
function resume() { if (state !== 'pause') return; state = 'play'; hideOv(); hud(); last = performance.now(); }

function hitBrick(b, br) {
  br.hp--; combo++;
  if (br.hp <= 0) { score += 10 * br.max + Math.min(combo, 10) * 2; burst(br.x + BW / 2, br.y + BH / 2, br.col); if (rnd() < 0.16) drops.push({ x: br.x + BW / 2, y: br.y + BH / 2, t: ['W', 'M', 'S', 'S', 'W', '♥'][Math.floor(rnd() * 6)], vy: 120 }); SFX.tone(600 + Math.min(combo, 12) * 40, 0.06, 'square', 0.08, 900); }
  else SFX.tone(300, 0.05, 'triangle', 0.1);
  if (score > best) best = score; hud();
}
function burst(x, y, col) { for (let i = 0; i < 10; i++) { const a = rnd() * Math.PI * 2, s = 40 + rnd() * 160; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + rnd() * 0.3, col }); } }
function applyDrop(t) {
  SFX.tone(700, 0.12, 'sine', 0.12, 1100);
  if (t === 'W') { paddle.w = 140; paddle.wideT = 12; }
  else if (t === 'M') { const src = balls.filter(b => !b.stuck); const add = []; for (const b of src.slice(0, 2)) { const s = Math.hypot(b.vx, b.vy) || speedBase(); for (const da of [-0.5, 0.5]) { const a = Math.atan2(b.vy, b.vx) + da; add.push(newBall(b.x, b.y, Math.cos(a) * s, Math.sin(a) * s)); } } balls.push(...add); if (balls.length > 12) balls.length = 12; }
  else if (t === 'S') slowT = 8;
  else if (t === '♥') { lives = Math.min(6, lives + 1); hud(); }
}
function update(dt) {
  if (paddle.wideT > 0 && (paddle.wideT -= dt) <= 0) paddle.w = 90;
  if (slowT > 0) slowT -= dt;
  const mul = slowT > 0 ? 0.65 : 1;
  const py = H - 52, ph = 12;
  if (keys.left) paddle.x -= 520 * dt; if (keys.right) paddle.x += 520 * dt;
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));
  for (const b of balls) {
    if (b.stuck) { b.x = paddle.x; b.y = py - b.r - 1; continue; }
    const steps = Math.ceil(Math.hypot(b.vx, b.vy) * dt * mul / 6);
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * dt * mul / steps; b.y += b.vy * dt * mul / steps;
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); SFX.tone(240, 0.03, 'sine', 0.05); }
      if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); SFX.tone(240, 0.03, 'sine', 0.05); }
      if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); SFX.tone(240, 0.03, 'sine', 0.05); }
      // 挡板
      if (b.vy > 0 && b.y + b.r >= py && b.y + b.r <= py + ph + 6 && Math.abs(b.x - paddle.x) <= paddle.w / 2 + b.r) {
        const rel = Math.max(-1, Math.min(1, (b.x - paddle.x) / (paddle.w / 2))); const ang = rel * 1.05; const sp = Math.min(560, Math.hypot(b.vx, b.vy) * 1.012);
        b.vx = Math.sin(ang) * sp; b.vy = -Math.cos(ang) * sp; b.y = py - b.r; combo = 0; SFX.tone(380, 0.05, 'triangle', 0.1, 500);
      }
      // 砖
      for (const br of bricks) {
        if (br.hp <= 0) continue;
        const cx = Math.max(br.x, Math.min(b.x, br.x + BW)), cy = Math.max(br.y, Math.min(b.y, br.y + BH));
        const dx = b.x - cx, dy = b.y - cy; if (dx * dx + dy * dy > b.r * b.r) continue;
        const ox = b.r - Math.abs(dx), oy = b.r - Math.abs(dy);
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 0.01) { b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx); b.x += dx > 0 ? ox : -ox; }
        else { b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy); b.y += dy > 0 ? oy : -oy; }
        hitBrick(b, br); break;
      }
    }
  }
  balls = balls.filter(b => b.y - b.r < H + 10);
  if (!balls.length) { loseLife(); return; }
  for (const d of drops) { d.y += d.vy * dt; if (d.y > py - 6 && d.y < py + ph + 10 && Math.abs(d.x - paddle.x) <= paddle.w / 2 + 10) { applyDrop(d.t); d.y = 1e9; } }
  drops = drops.filter(d => d.y < H + 20);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; } parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 3);
  if (!bricks.some(b => b.hp > 0)) { state = 'clear'; score += 100 * level; if (score > best) { best = score; store.set('best', best); } hud(); SFX.tone(660, 0.15, 'square', 0.1, 990); setTimeout(() => SFX.tone(990, 0.3, 'square', 0.1, 1320), 150); showOv(`第 ${level} 关 通过！`, `+${100 * level} 过关奖励 · 当前 ${score} 分`, [['下一关', nextLevel]]); }
}
function draw() {
  ctx.save(); ctx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);
  if (shake > 0) ctx.translate((rnd() - .5) * 8 * shake, (rnd() - .5) * 8 * shake);
  ctx.fillStyle = '#120a26'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.03)'; for (let y = 0; y < H; y += 24) ctx.fillRect(0, y, W, 1);
  for (const br of bricks) { if (br.hp <= 0) continue; ctx.fillStyle = br.col; rr(br.x, br.y, BW, BH, 5); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(br.x, br.y, BW, BH / 2, 5); ctx.fill(); if (br.max === 2) { ctx.strokeStyle = br.hp === 2 ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; rr(br.x + 2, br.y + 2, BW - 4, BH - 4, 4); ctx.stroke(); if (br.hp === 1) { ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.moveTo(br.x + BW * .3, br.y + 3); ctx.lineTo(br.x + BW * .5, br.y + BH * .6); ctx.lineTo(br.x + BW * .42, br.y + BH - 3); ctx.stroke(); } } }
  const py = H - 52; const g = ctx.createLinearGradient(0, py, 0, py + 12); g.addColorStop(0, '#ffb3ea'); g.addColorStop(1, '#ff5cc8'); ctx.fillStyle = g; rr(paddle.x - paddle.w / 2, py, paddle.w, 12, 6); ctx.fill();
  if (paddle.wideT > 0) { ctx.strokeStyle = `rgba(255,255,255,${0.3 + 0.3 * Math.sin(performance.now() / 100)})`; ctx.lineWidth = 2; rr(paddle.x - paddle.w / 2 - 2, py - 2, paddle.w + 4, 16, 8); ctx.stroke(); }
  for (const b of balls) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 12; ctx.fillStyle = slowT > 0 ? '#9be7ff' : '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
  for (const d of drops) { const col = { W: '#4fc3f7', M: '#ffd93d', S: '#b388ff', '♥': '#ff5d8f' }[d.t]; ctx.fillStyle = col; rr(d.x - 14, d.y - 9, 28, 18, 6); ctx.fill(); ctx.fillStyle = '#1a1033'; ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(d.t, d.x, d.y + 1); }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); } ctx.globalAlpha = 1;
  if (balls.some(b => b.stuck) && state === 'play') { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '700 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('点击 / 空格 发球', W / 2, H - 90); }
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function frame(now) { const dt = Math.min(0.033, (now - last) / 1000); last = now; if (state === 'play') update(dt); draw(); requestAnimationFrame(frame); }

let DPR = 1;
function layout() { const st = $('.stage'); const aw = st.clientWidth - 20, ah = st.clientHeight - 10; scale = Math.min(aw / W, ah / H); DPR = Math.min(window.devicePixelRatio || 1, 3); cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px'; cv.width = Math.round(W * scale * DPR); cv.height = Math.round(H * scale * DPR); draw(); }
// 输入
const keys = { left: false, right: false };
window.addEventListener('keydown', e => { SFX.unlock(); if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true; else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true; else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (state === 'title' || state === 'over') startGame(); else if (state === 'pause') resume(); else if (state === 'clear') nextLevel(); else launch(); } else if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { state === 'play' ? pause() : resume(); } else if (e.key === 'r' || e.key === 'R') startGame(); });
window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false; else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false; });
const stage = $('.stage'); let dragging = false, dragOff = 0, downT = 0;
const toX = e => (e.clientX - cv.getBoundingClientRect().left) / scale;
stage.addEventListener('pointerdown', e => { SFX.unlock(); if (state !== 'play') return; dragging = true; downT = performance.now(); const x = toX(e); dragOff = Math.abs(x - paddle.x) < paddle.w ? paddle.x - x : 0; if (!dragOff) paddle.x = x; });
stage.addEventListener('pointermove', e => { if (!dragging) return; paddle.x = toX(e) + dragOff; });
window.addEventListener('pointerup', e => { if (dragging && performance.now() - downT < 250) launch(); dragging = false; });
$('#btnPause').onclick = () => { if (state === 'play') pause(); else if (state === 'pause') resume(); };
const LBB = 'score', lbFmt = (v, e) => v + ' 分' + (e && e.meta && e.meta.level ? ' · 第 ' + e.meta.level + ' 关' : '');
$('#btnLB').onclick = () => LB.show('breakout', LBB, lbFmt);
const muteBtn = $('#btnMute'); const syncMute = () => muteBtn.textContent = SFX.muted ? '🔇' : '🔊'; muteBtn.onclick = () => { SFX.toggle(); syncMute(); }; syncMute();
window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

hud();
if (STILL) {
  level = 3; buildLevel(3); let n = 0; for (const b of bricks) if ((n++ * 7) % 11 < 4) b.hp = 0; score = 1840; lives = 2; paddle.x = 210; paddle.w = 140; paddle.wideT = 5;
  balls = [newBall(230, 380, 180, -260), newBall(330, 300, -200, 220)]; drops = [{ x: 150, y: 330, t: 'M', vy: 0 }]; burst(300, 200, '#ffd93d'); for (const p of parts) { p.x += p.vx * 0.25; p.y += p.vy * 0.25; p.life = 0.5; }
  hideOv(); hud(); document.title = 'STILL-READY'; let k = 0; (function redraw() { layout(); if (++k < 10) requestAnimationFrame(redraw); })();
} else {
  buildLevel(1); serveBall(); layout(); requestAnimationFrame(layout);
  showOv('🧱 打砖块', '拖动挡板接球，清空全部砖块进入下一关<br>W 加宽 · M 分裂 · S 减速 · ♥ 加命', [['开始', startGame]]);
  last = performance.now(); requestAnimationFrame(frame);
}
</script>
