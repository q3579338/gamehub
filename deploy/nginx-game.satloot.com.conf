# game.satloot.com —— satloot 游戏厅（纯静态：首页 + /play/ 壳 + /g/<id>/ 单文件游戏 + /shots/ 封面）
# 装法：放进 /etc/nginx/sites-available/game.satloot.com，软链到 sites-enabled/，nginx -t 通过后 reload。
# 证书沿用本机自签（Cloudflare 回源 Full 模式），和 tool.satloot.com / earn.satloot.com 一致。
# 不反代、不开放任何写接口，和机上其它站点互不干扰。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.satloot.com;

    ssl_certificate     /etc/ssl/certs/satloot-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/satloot-selfsigned.key;

    root /var/www/gamehub;
    index index.html;

    # 3D 游戏单文件 1MB+（内联 three.js），压完约 1/4
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;

    # 页面（首页 / play 壳 / 游戏本体）每次发布都会变，别让 Cloudflare 和浏览器缓存住旧的
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    # 封面图重截会同名覆盖，缓存一天即可
    location /shots/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
